<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站总览 - 托斯卡纳</title>
    <style>
        /* 继承主样式基础 */
        :root { --bg-cream: #fbf8f3; --bg-khaki: #f4eee0; --text-dark: #3a322d; --text-muted: #726659; --accent-brown: #8c6d53; --accent-terracotta: #ab6b51; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg-cream); color: var(--text-dark); font-family: "Georgia", "Noto Serif SC", serif; line-height: 1.8; }
        .header-nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(251,248,243,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .nav-logo { font-weight: bold; color: var(--accent-brown); text-decoration: none; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--text-dark); }
        .nav-links a.active { color: var(--accent-terracotta); }
        
        .main-container { padding: 140px 20px 80px 20px; max-width: 1000px; margin: 0 auto; }
        .intro-box { background: var(--bg-khaki); padding: 50px; border-radius: 4px; text-align: center; margin-bottom: 50px; }
        .intro-chapter { font-size: 0.9rem; color: var(--accent-terracotta); letter-spacing: 1.5px; }
        .intro-title { font-size: 1.8rem; margin: 15px 0; font-weight: normal; }
        .intro-tags { color: var(--accent-brown); letter-spacing: 2px; font-size: 1.1rem; }

        .poetic-section { text-align: center; margin: 60px 0; font-size: 1.2rem; color: var(--text-muted); }

        .footer { background-color: var(--bg-khaki); padding: 30px; text-align: center; margin-top: 60px; font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <nav class="header-nav">
        <a href="index.html" class="nav-logo">Tuscany</a>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="overview.html" class="active">网站总览</a></li>
            <li><a href="cities.html">旅行行程</a></li>
            <li><a href="art.html">文化艺术</a></li>
            <li><a href="food.html">美食美酒</a></li>
            <li><a href="events.html">特色活动</a></li>
        </ul>
    </nav>

    <main class="main-container">
        <div class="intro-box">
            <p class="intro-chapter">Chapter 01:</p>
            <h2 class="intro-title">四大板块，带你读懂托斯卡纳的路线、味道与风光</h2>
            <p class="intro-tags">路线·饮食·文化·活动</p>
        </div>

        <div class="poetic-section">
            <p>四季流转，<br>邀你邂逅托斯卡纳的晴日、<br>山海与诗意。</p>
        </div>
    </main>

    <footer class="footer">
        <p>TUSCANY • 网站总览</p>
    </footer>
</body>
</html>
