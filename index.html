<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 | Welcome to Tuscany</title>
    <style>
        :root {
            --bg-cream: #FDFBF7;
            --bg-khaki: #EFEBE4;
            --text-dark: #2C221E;
            --text-muted: #6B5E55;
            --accent-warm: #8C6A53;
            --accent-terracotta: #C87A57;
            --white-glass: rgba(253, 251, 247, 0.88);
            --shadow-soft: 0 10px 30px rgba(44, 34, 30, 0.05);
            --shadow-hover: 0 15px 35px rgba(44, 34, 30, 0.12);
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: "Playfair Display", "Georgia", "PingFang SC", "Microsoft YaHei", serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* 全局共享导航栏 */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center;
            transition: var(--transition);
            background: linear-gradient(180deg, rgba(44,34,30,0.4) 0%, rgba(0,0,0,0) 100%);
        }
        .navbar.scrolled {
            background: var(--white-glass);
            backdrop-filter: blur(12px);
            padding: 1rem 5%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .nav-logo { font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: #FFF; text-decoration: none; }
        .navbar.scrolled .nav-logo { color: var(--text-dark); }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 0.95rem; position: relative; padding-bottom: 4px; }
        .navbar.scrolled .nav-links a { color: var(--text-dark); }
        .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background-color: var(--accent-terracotta); transition: var(--transition); }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

        /* 首屏 Hero */
        .hero {
            position: relative; height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 0 1rem; overflow: hidden;
        }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; filter: brightness(0.7); transform: scale(1.05); }
        .hero-content { color: #FFF; max-width: 800px; animation: fadeInBlur 1.2s ease forwards; }
        .hero-tag { font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 1rem; color: var(--bg-khaki); }
        .hero-title { font-size: 3.5rem; font-weight: 400; margin-bottom: 1.5rem; letter-spacing: 2px; }
        .hero-desc { font-size: 1.1rem; color: rgba(255,255,255,0.85); margin-bottom: 2.5rem; font-weight: 300; }
        .btn-start {
            display: inline-block; padding: 0.9rem 2.8rem; border: 1px solid rgba(255,255,255,0.8);
            color: #FFF; text-decoration: none; letter-spacing: 2px; font-size: 0.95rem;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(4px); transition: var(--transition);
        }
        .btn-start:hover { background: var(--bg-cream); color: var(--text-dark); border-color: var(--bg-cream); }

        .footer { background-color: var(--text-dark); color: var(--bg-khaki); padding: 4rem 10% 2rem; text-align: center; }
        .footer-tagline { font-size: 1.4rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 1.5rem; }
        .footer-divider { width: 50px; height: 1px; background-color: var(--accent-warm); margin: 0 auto 1.5rem; opacity: 0.5; }
        .footer-copy { font-size: 0.85rem; color: rgba(239, 235, 228, 0.6); }

        @keyframes fadeInBlur { from { opacity: 0; transform: translateY(20px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-logo">Welcome to Tuscany</a>
        <ul class="nav-links">
            <li><a href="index.html" class="active">首页</a></li>
            <li><a href="overview.html">网站总览</a></li>
            <li><a href="cities.html">旅行行程</a></li>
            <li><a href="art.html">文化艺术</a></li>
            <li><a href="food.html">美食美酒</a></li>
            <li><a href="events.html">特色活动</a></li>
        </ul>
    </nav>

    <section class="hero">
        <!-- [IMAGE PLACEHOLDER] 托斯卡纳风光全景背景图 -->
        <img src="https://images.unsplash.com/photo-1541370976299-4d24ebbc9077?q=80&w=1920&auto=format&fit=crop" alt="Tuscany" class="hero-bg">
        <div class="hero-content">
            <p class="hero-tag">Welcome to Tuscany</p>
            <h1 class="hero-title">托斯卡纳</h1>
            <p class="hero-desc">艺术、田园、美酒与慢生活，你的意大利之旅从这里开始</p>
            <a href="overview.html" class="btn-start">开始探索</a>
        </div>
    </section>

    <footer class="footer">
        <p class="footer-tagline">Tuscany — Where time stands still.</p>
        <div class="footer-divider"></div>
        <p class="footer-copy">&copy; 2026 Welcome to Tuscany. All Rights Reserved.</p>
    </footer>

    <script>
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        });
    </script>
</body>
</html>
