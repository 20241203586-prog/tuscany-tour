<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 | 托斯卡纳 Welcome to Tuscany</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background-color: #F7F1E4;
    color: #3C3223;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a{text-decoration:none;color:inherit;}
  
  /* 固定顶部导航 */
  .header{
    position: fixed;
    top:0; left:0; right:0;
    height: 60px;
    background: rgba(247, 241, 228, 0.95);
    border-bottom: 1px solid #D8C6A0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .nav-list{
    display: flex;
    gap: 30px;
    list-style: none;
  }
  .nav-link{
    font-size: 16px;
    color: #3C3223;
    font-weight: 500;
    padding: 5px 0;
  }
  .nav-link.active{
    color: #C1594E;
    border-bottom: 2px solid #C1594E;
  }

  /* 页面内容区 */
  .main-content{
    padding-top: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page-image{
    width: 100%;
    max-width: 1200px;
    height: auto;
    display: block;
  }

  /* 底部页脚 */
  .footer{
    background: #3C3223;
    color: #F7F1E4;
    padding: 30px 0;
    text-align: center;
    font-size: 14px;
    border-top: 1px solid #D8C6A0;
  }
</style>
</head>
<body>

  <!-- 全站共用导航 -->
  <header class="header">
    <ul class="nav-list">
      <li><a href="index.html" class="nav-link active">首页</a></li>
      <li><a href="overview.html" class="nav-link">网站总览</a></li>
      <li><a href="cities.html" class="nav-link">旅行行程</a></li>
      <li><a href="art.html" class="nav-link">文化艺术</a></li>
      <li><a href="food.html" class="nav-link">美食美酒</a></li>
      <li><a href="events.html" class="nav-link">特色活动</a></li>
    </ul>
  </header>

  <!-- 主页面图像（截取的原设计首页页面图） -->
  <main class="main-content">
    <!-- 图片占位：首页截屏图片 (可在 src 中替换为你本地保存的图片路径，如 images/index.png) -->
    <img src="https://images.unsplash.com/photo-1541370976299-4d24ebbcbe0c?auto=format&fit=crop&w=1200&q=80" alt="托斯卡纳首页设计图" class="page-image">
  </main>

  <footer class="footer">
    <p>Welcome to Tuscany | 托斯卡纳</p>
    <p style="margin-top: 8px; opacity: 0.7;">&copy; 2026 保留所有权利</p>
  </footer>

</body>
</html>
