<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>托斯卡纳 - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f4e8c1; /* 维持羊皮纸/温和黄色调背景 */
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #f0e0b0;
            padding: 15px 0;
            border-bottom: 1px solid #d4c090;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
        }
        nav a.active { color: #8b0000; }
        .hero-title-img {
            text-align: center;
            padding: 40px 20px 10px;
        }
        .hero-title-img h1 {
            font-size: 56px;
            color: #004499;
            font-family: "STKaiti", "Kaiti SC", serif;
            letter-spacing: 4px;
        }
        .hero-banner {
            text-align: center;
            padding: 20px;
        }
        .hero-banner h2 { font-size: 24px; color: #555; margin-bottom: 10px; }
        .hero-banner p { font-size: 18px; color: #666; margin-bottom: 20px; }
        .btn-explore {
            display: inline-block;
            background-color: #8b0000;
            color: #fff;
            padding: 10px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
        }
        .section-intro {
            max-width: 900px;
            margin: 40px auto;
            text-align: center;
            padding: 30px;
            border-top: 1px dashed #b5a070;
            border-bottom: 1px dashed #b5a070;
        }
        .section-intro h3 { font-size: 22px; color: #8b0000; margin-bottom: 10px; }
        .section-intro p { font-size: 16px; color: #444; }
        .footer-quote {
            text-align: center;
            padding: 40px 20px;
            font-size: 18px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="active">首页</a>
            <a href="routes.html">旅行行程</a>
            <a href="culture.html">文化艺术</a>
            <a href="food.html">美食美酒</a>
            <a href="events.html">特色活动</a>
        </nav>
    </header>

    <main>
        <section class="hero-title-img">
            <h1>托斯卡纳</h1>
        </section>

        <section class="hero-banner">
            <h2>Welcome to Tuscany</h2>
            <p>艺术、田园、美酒与慢生活，你的意大利之旅从这里开始</p>
            <a href="routes.html" class="btn-explore">开始探索</a>
        </section>

        <section class="section-intro">
            <h3>四大板块，带你读懂托斯卡纳的路线、味道与风光</h3>
            <p>路线 · 饮食 · 文化 · 活动</p>
        </section>

        <div class="footer-quote">
            <p>四季流转，邀你邂逅托斯卡纳的晴日、山海与诗意。</p>
        </div>
    </main>

</body>
</html>
