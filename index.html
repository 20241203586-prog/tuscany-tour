<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>托斯卡纳，文艺复兴永不落幕 | 意大利托斯卡纳旅游</title>

<!-- 引入中文衬线与黑体字体，标题与正文分别使用不同字重 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  /* ========== 基础样式与设计变量 ========== */
  :root{
    --cream:#F7F2E7;        /* 背景米白 */
    --ink:#2B2A22;          /* 主文字深棕黑 */
    --olive:#5B6B45;        /* 橄榄绿 - 主色 */
    --olive-dark:#46543556; /* 橄榄绿深色透明度变体 */
    --gold:#C89B3C;         /* 麦穗金 - 点缀色 */
    --terracotta:#B15D3B;   /* 屋瓦赤陶色 - 点缀色 */
    --white:#FFFFFF;
    --nav-h:76px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    font-family:"Noto Sans SC", sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.6;
    overflow-x:hidden;
  }

  h1,h2,h3{
    font-family:"Noto Serif SC", serif;
    font-weight:600;
  }

  a{text-decoration:none;color:inherit;}
  ul{list-style:none;}
  img{display:block;max-width:100%;}

  /* ========== 顶部固定导航栏 ========== */
  .navbar{
    position:fixed;
    top:0;left:0;right:0;
    height:var(--nav-h);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    z-index:100;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(6px);
    transition:background .35s ease, box-shadow .35s ease;
  }
  .navbar.scrolled{
    background:rgba(247,242,231,0.94);
    box-shadow:0 2px 14px rgba(0,0,0,0.08);
  }
  .navbar.scrolled .nav-logo,
  .navbar.scrolled .nav-links a{color:var(--ink);}

  .nav-logo{
    font-family:"Noto Serif SC", serif;
    font-size:1.3rem;
    font-weight:700;
    color:var(--white);
    letter-spacing:2px;
    transition:color .35s ease;
  }

  .nav-links{
    display:flex;
    gap:2.4rem;
  }
  .nav-links a{
    color:var(--white);
    font-size:0.98rem;
    letter-spacing:1px;
    position:relative;
    padding-bottom:4px;
    transition:color .35s ease;
  }
  .nav-links a::after{
    content:"";
    position:absolute;
    left:0;bottom:0;
    width:0%;
    height:2px;
    background:var(--gold);
    transition:width .3s ease;
  }
  .nav-links a:hover::after{width:100%;}

  /* 移动端汉堡按钮 */
  .nav-toggle{
    display:none;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
    background:none;
    border:none;
  }
  .nav-toggle span{
    width:26px;height:2px;
    background:var(--white);
    transition:background .3s ease;
  }
  .navbar.scrolled .nav-toggle span{background:var(--ink);}

  /* ========== 全屏首图英雄区 ========== */
  .hero{
    position:relative;
    height:100vh;
    min-height:560px;
    display:flex;
    align-items:center;
    justify-content:center;
    background-image:
      linear-gradient(rgba(30,28,18,0.42), rgba(30,28,18,0.55)),
      url("https://images.pexels.com/photos/27659795/pexels-photo-27659795.jpeg?auto=compress&cs=tinysrgb&w=1920");
    background-size:cover;
    background-position:center;
  }

  .hero-content{
    text-align:center;
    color:var(--white);
    padding:0 1.5rem;
    max-width:820px;
  }

  .hero-title{
    font-size:clamp(2.2rem, 5.5vw, 4.2rem);
    font-weight:700;
    letter-spacing:4px;
    text-shadow:0 2px 18px rgba(0,0,0,0.35);
  }

  .hero-subtitle{
    margin-top:1.4rem;
    font-size:clamp(0.95rem, 1.6vw, 1.25rem);
    font-weight:300;
    letter-spacing:2px;
    color:#F3EFE4;
  }

  /* 椭圆细框按钮 */
  .btn-outline{
    display:inline-block;
    margin-top:2.6rem;
    padding:14px 44px;
    border:1.4px solid var(--white);
    border-radius:999px;
    color:var(--white);
    font-size:1rem;
    letter-spacing:2px;
    transition:background .3s ease, color .3s ease, transform .3s ease;
  }
  .btn-outline:hover{
    background:var(--white);
    color:var(--ink);
    transform:translateY(-2px);
  }

  /* 向下提示箭头，轻微上下浮动动画 */
  .scroll-hint{
    position:absolute;
    bottom:34px;left:50%;
    transform:translateX(-50%);
    color:var(--white);
    font-size:1.6rem;
    animation:float 2.2s ease-in-out infinite;
    opacity:.85;
  }
  @keyframes float{
    0%,100%{transform:translate(-50%,0);}
    50%{transform:translate(-50%,10px);}
  }

  /* 移动端导航适配 */
  @media (max-width:820px){
    .nav-links{
      position:fixed;
      top:var(--nav-h);
      right:0;
      width:220px;
      flex-direction:column;
      background:rgba(247,242,231,0.98);
      padding:1.6rem 1.8rem;
      gap:1.2rem;
      transform:translateX(100%);
      transition:transform .35s ease;
      box-shadow:-4px 0 16px rgba(0,0,0,0.08);
    }
    .nav-links.open{transform:translateX(0);}
    .nav-links a{color:var(--ink) !important;}
    .nav-toggle{display:flex;}
  }
</style>
</head>
<body>

  <!-- 顶部固定导航栏：首页与详情页共用同一视觉语言 -->
  <header class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">托斯卡纳 TUSCANY</a>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="main.html">首页</a></li>
        <li><a href="main.html#routes">旅行路线</a></li>
        <li><a href="main.html#food">美食美酒</a></li>
        <li><a href="main.html#culture">文化艺术</a></li>
        <li><a href="main.html#events">特色活动</a></li>
        <li><a href="main.html#nature">自然风光</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="打开菜单">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- 全屏封面：托斯卡纳田园风景背景 + 居中大标题 -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">托斯卡纳，文艺复兴永不落幕</h1>
      <p class="hero-subtitle">艺术、田园、美酒与慢生活，你的意大利之旅从这里开始</p>
      <a href="main.html" class="btn-outline">探索托斯卡纳路线</a>
    </div>
    <div class="scroll-hint">⌄</div>
  </section>

  <script>
    // 滚动时导航栏由透明切换为浅色实底，保证在图片与文字背景下都清晰可读
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 40) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // 移动端汉堡菜单开关
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    navToggle.addEventListener('click', () => {
      navLinks.classList.toggle('open');
    });
  </script>
</body>
</html>
